# Application Config
server.port=8080
spring.application.name=coordinated-ai-interview-backend

# Database Config (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:interview_panel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Python AI Service URL Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
